<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분석 결과 - JD 후보자 매칭 시스템</title>
  <script>
    (function() {
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    .fit-상 { background:#d1fae5; color:#065f46; }
    .fit-중 { background:#fef3c7; color:#92400e; }
    .fit-하 { background:#fee2e2; color:#991b1b; }
    .rec-적극\ 추천 { background:#dbeafe; color:#1e40af; }
    .rec-추천 { background:#d1fae5; color:#065f46; }
    .rec-검토\ 필요 { background:#fef9c3; color:#92400e; }
    .rec-미추천 { background:#fee2e2; color:#991b1b; }
    .dark .fit-상 { background:#064e3b; color:#6ee7b7; }
    .dark .fit-중 { background:#78350f; color:#fde68a; }
    .dark .fit-하 { background:#7f1d1d; color:#fca5a5; }
    .dark .rec-적극\ 추천 { background:#1e3a8a; color:#93c5fd; }
    .dark .rec-추천 { background:#064e3b; color:#6ee7b7; }
    .dark .rec-검토\ 필요 { background:#78350f; color:#fde68a; }
    .dark .rec-미추천 { background:#7f1d1d; color:#fca5a5; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }

    @media print {
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: white !important; }
      .max-w-5xl { max-width: 100% !important; padding: 0 16px !important; }
      .bg-white, .dark\:bg-slate-800 { break-inside: avoid; page-break-inside: avoid; }
      [id^="card-detail-"] { display: block !important; }
      .card-chevron { display: none !important; }
      details { display: block; }
      details > summary { display: none; }
      .print-header { display: block !important; }
    }

    .print-header { display: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen font-sans transition-colors duration-200">

<div class="max-w-5xl mx-auto py-8 px-4">

  <!-- 인쇄용 헤더 -->
  <div class="print-header mb-4 pb-3 border-b border-slate-300">
    <div class="text-xl font-bold text-slate-800">JD 후보자 매칭 시스템 — 분석 결과</div>
    <div id="print-jd-title" class="text-sm text-slate-500 mt-1"></div>
    <div id="print-date" class="text-xs text-slate-400 mt-0.5"></div>
  </div>

  <!-- 헤더 -->
  <div class="flex flex-wrap items-start justify-between gap-3 mb-6 no-print">
    <div>
      <h1 class="text-2xl font-bold text-indigo-700 dark:text-indigo-400">분석 결과</h1>
      <p id="jd-title" class="text-slate-500 dark:text-slate-400 text-sm mt-0.5"></p>
    </div>
    <div class="flex flex-wrap gap-2 text-sm items-center">
      <a href="/history" class="text-slate-500 dark:text-slate-400 hover:underline">이력 보기</a>
      <button onclick="printResult()"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
        </svg>
        PDF 인쇄
      </button>
      <button onclick="toggleDark()" title="다크/라이트 모드"
        class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
        <svg class="w-5 h-5 text-slate-500 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg class="w-5 h-5 text-yellow-400 hidden dark:block" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 001.061-1.06l-1.59-1.591zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.166 6.166a.75.75 0 001.06 1.06l1.59 1.591a.75.75 0 001.061-1.06L6.166 6.166z"/>
        </svg>
      </button>
      <a href="/" class="text-indigo-600 dark:text-indigo-400 hover:underline">← 새로 분석하기</a>
    </div>
  </div>

  <!-- 요약 카드 -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="summary-cards"></div>

  <!-- 추천 등급 분포 차트 -->
  <div id="rec-chart" class="hidden bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-6">
    <h3 class="text-sm font-semibold text-slate-600 dark:text-slate-300 mb-3">추천 등급 분포</h3>
    <div id="rec-chart-bars" class="space-y-2"></div>
  </div>

  <!-- 필터 탈락자 -->
  <div id="filtered-section" class="hidden mb-6">
    <details class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
      <summary class="p-4 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-between">
        <span id="filtered-title">필터 탈락 후보자</span>
        <svg class="w-4 h-4 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </summary>
      <div id="filtered-list" class="px-4 pb-4 space-y-2"></div>
    </details>
  </div>

  <!-- 매칭 결과 -->
  <div id="results-section">
    <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-3">매칭 결과 (점수 순위)</h2>
    <div id="results-list" class="space-y-4"></div>
  </div>

  <!-- 데이터 없음 -->
  <div id="no-data" class="hidden text-center py-20">
    <p class="text-slate-400 dark:text-slate-500 text-lg">분석 결과가 없습니다.</p>
    <a href="/" class="mt-4 inline-block text-indigo-600 dark:text-indigo-400 hover:underline">← 분석 페이지로 돌아가기</a>
  </div>
</div>

<script>
function toggleDark() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  let data;
  if (id) {
    const res = await fetch(`/api/history/${id}`);
    if (!res.ok) { data = null; } else { data = await res.json(); }
  } else {
    data = JSON.parse(sessionStorage.getItem('analysisResult') || 'null');
  }

  if (!data) {
    document.getElementById('results-section').classList.add('hidden');
    document.getElementById('no-data').classList.remove('hidden');
  } else {
    const jd = data.jd_requirements;
    const titleText = `직무: ${jd.position || '-'} | 도메인: ${jd.domain || '-'}`;
    document.getElementById('print-jd-title').textContent = titleText;
    document.getElementById('print-date').textContent =
      `출력일시: ${new Date().toLocaleString('ko-KR')}`;
    render(data);
  }
}

init();

function scoreBar(label, score) {
  const color = score >= 80 ? 'bg-green-500' : score >= 60 ? 'bg-yellow-400' : 'bg-red-400';
  const textColor = score >= 80 ? 'text-green-600 dark:text-green-400' : score >= 60 ? 'text-yellow-600 dark:text-yellow-400' : 'text-red-500 dark:text-red-400';
  return `<div>
    <div class="text-xs text-slate-400 dark:text-slate-500 mb-1">${label}</div>
    <div class="bg-slate-100 dark:bg-slate-700 rounded-full h-2 w-full">
      <div class="${color} h-2 rounded-full" style="width:${score}%"></div>
    </div>
    <div class="text-xs font-semibold ${textColor} mt-0.5">${score}점</div>
  </div>`;
}

function render(d) {
  const jd = d.jd_requirements;
  document.getElementById('jd-title').textContent = `직무: ${jd.position || '-'} | 도메인: ${jd.domain || '-'}`;

  // 요약 카드
  const passed = d.results.filter(r => r.filter_result.passed);
  const topCount = passed.filter(r => r.match_result && r.match_result.total_score >= 70).length;
  const cards = [
    {
      label: '총 이력서', value: d.total_resumes, sub: '업로드된 전체',
      bg: 'bg-indigo-50 dark:bg-indigo-950', numColor: 'text-indigo-700 dark:text-indigo-300', border: 'border-indigo-100 dark:border-indigo-900',
      icon: `<svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
    },
    {
      label: '필터 탈락', value: d.filtered_out_count, sub: '조건 미충족',
      bg: 'bg-red-50 dark:bg-red-950', numColor: 'text-red-600 dark:text-red-400', border: 'border-red-100 dark:border-red-900',
      icon: `<svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>`,
    },
    {
      label: '분석 완료', value: d.analyzed_count, sub: 'AI 점수 산정',
      bg: 'bg-green-50 dark:bg-green-950', numColor: 'text-green-700 dark:text-green-400', border: 'border-green-100 dark:border-green-900',
      icon: `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
    },
    {
      label: '상위 후보', value: topCount, sub: '70점 이상',
      bg: 'bg-blue-50 dark:bg-blue-950', numColor: 'text-blue-700 dark:text-blue-400', border: 'border-blue-100 dark:border-blue-900',
      icon: `<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>`,
    },
  ];
  document.getElementById('summary-cards').innerHTML = cards.map(c =>
    `<div class="${c.bg} rounded-2xl border ${c.border} p-4">
       <div class="flex items-center justify-between mb-2">
         ${c.icon}
         <span class="text-xs text-slate-400 dark:text-slate-500">${c.sub}</span>
       </div>
       <div class="${c.numColor} text-3xl font-bold leading-none">${c.value}</div>
       <div class="text-sm text-slate-600 dark:text-slate-300 font-medium mt-1">${c.label}</div>
     </div>`
  ).join('');

  // 필터 탈락자
  const failed = d.results.filter(r => !r.filter_result.passed);
  if (failed.length > 0) {
    document.getElementById('filtered-section').classList.remove('hidden');
    document.getElementById('filtered-title').textContent = `필터 탈락 후보자 (${failed.length}명)`;
    document.getElementById('filtered-list').innerHTML = failed.map(r =>
      `<div class="flex items-start gap-3 py-2 border-t border-slate-100 dark:border-slate-700">
         <span class="text-red-400 text-lg">✗</span>
         <div>
           <span class="font-medium text-slate-700 dark:text-slate-200">${r.profile.name || r.profile.filename}</span>
           <div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">${r.filter_result.reasons.join(' · ')}</div>
         </div>
       </div>`
    ).join('');
  }

  // 추천 등급 분포 차트
  const matched0 = d.results.filter(r => r.filter_result.passed && r.match_result);
  if (matched0.length > 0) {
    const recDefs = [
      { key: '적극 추천', color: 'bg-blue-500', textColor: 'text-blue-700 dark:text-blue-400' },
      { key: '추천',     color: 'bg-green-500', textColor: 'text-green-700 dark:text-green-400' },
      { key: '검토 필요', color: 'bg-yellow-400', textColor: 'text-yellow-700 dark:text-yellow-400' },
      { key: '미추천',   color: 'bg-red-400',   textColor: 'text-red-700 dark:text-red-400' },
    ];
    const recCounts = {};
    matched0.forEach(r => {
      const k = r.match_result.recommendation;
      recCounts[k] = (recCounts[k] || 0) + 1;
    });
    const maxCount = Math.max(...Object.values(recCounts));
    const barsHtml = recDefs
      .filter(def => recCounts[def.key])
      .map(def => {
        const cnt = recCounts[def.key] || 0;
        const pct = Math.round(cnt / matched0.length * 100);
        const barW = Math.round(cnt / maxCount * 100);
        return `<div class="flex items-center gap-3">
          <div class="w-20 shrink-0 text-xs font-medium text-slate-600 dark:text-slate-300 text-right">${def.key}</div>
          <div class="flex-1 bg-slate-100 dark:bg-slate-700 rounded-full h-4 overflow-hidden">
            <div class="${def.color} h-4 rounded-full" style="width:${barW}%"></div>
          </div>
          <div class="w-16 shrink-0 text-xs ${def.textColor} font-semibold">${cnt}명 (${pct}%)</div>
        </div>`;
      }).join('');
    document.getElementById('rec-chart').classList.remove('hidden');
    document.getElementById('rec-chart-bars').innerHTML = barsHtml;
  }

  // 매칭 결과 카드
  const matched = d.results.filter(r => r.filter_result.passed && r.match_result);
  if (matched.length === 0) {
    document.getElementById('results-list').innerHTML =
      '<p class="text-slate-400 dark:text-slate-500 text-sm">필터 통과 후보자가 없습니다.</p>';
    return;
  }

  document.getElementById('results-list').innerHTML = matched.map((r, idx) => {
    const m = r.match_result;
    const p = r.profile;
    const scoreColor = m.total_score >= 80
      ? 'text-green-600 dark:text-green-400'
      : m.total_score >= 60
      ? 'text-yellow-600 dark:text-yellow-400'
      : 'text-red-500 dark:text-red-400';
    const fitClass = `fit-${m.overall_fit}`;
    const recClass = `rec-${m.recommendation}`;
    const cardId = `card-detail-${idx}`;

    return `
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <!-- 카드 헤더 -->
      <div class="flex items-center justify-between px-4 sm:px-5 py-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors"
           onclick="toggleCard('${cardId}', this)">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 shrink-0 rounded-full bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center text-indigo-700 dark:text-indigo-300 font-bold text-sm">${idx + 1}</div>
          <div class="min-w-0">
            <div class="font-semibold text-slate-800 dark:text-slate-100 truncate">${p.name || p.filename}</div>
            <div class="text-xs text-slate-400 dark:text-slate-500 truncate">${p.filename}</div>
          </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-3 shrink-0 ml-2">
          <div class="text-right">
            <div class="${scoreColor} text-2xl sm:text-3xl font-bold">${m.total_score}<span class="text-sm font-normal text-slate-400 dark:text-slate-500">점</span></div>
            <div class="flex gap-1 mt-1 justify-end">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${fitClass}">${m.overall_fit}급</span>
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${recClass}">${m.recommendation}</span>
            </div>
          </div>
          <svg class="card-chevron w-5 h-5 text-slate-400 dark:text-slate-500 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

      <!-- 상세 영역 -->
      <div id="${cardId}" class="hidden">
        <!-- 세부 점수 바 -->
        <div class="px-4 sm:px-5 py-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center border-t border-slate-100 dark:border-slate-700">
          ${scoreBar('스킬 매칭', m.skill_match_score)}
          ${scoreBar('경력 적합', m.experience_score)}
          ${scoreBar('학력 충족', m.education_score)}
          ${scoreBar('도메인 적합', m.domain_fit_score)}
        </div>

        <!-- 기본 정보 -->
        <div class="px-4 sm:px-5 py-3 flex flex-wrap gap-x-5 gap-y-1 text-sm text-slate-500 dark:text-slate-400 border-t border-slate-100 dark:border-slate-700">
          ${p.age ? `<span>나이: <b class="text-slate-700 dark:text-slate-200">${p.age}세</b></span>` : ''}
          ${p.total_experience_years != null ? `<span>경력: <b class="text-slate-700 dark:text-slate-200">${p.total_experience_years}년</b></span>` : ''}
          ${p.education ? `<span>학력: <b class="text-slate-700 dark:text-slate-200">${p.education}</b> ${p.education_major ? '(' + p.education_major + ')' : ''}</span>` : ''}
          ${p.last_salary ? `<span>전직장 연봉: <b class="text-slate-700 dark:text-slate-200">${p.last_salary.toLocaleString()}만원</b></span>` : ''}
          ${p.certifications?.length ? `<span>자격증: <b class="text-slate-700 dark:text-slate-200">${p.certifications.join(', ')}</b></span>` : ''}
        </div>

        <!-- 보유 스킬 -->
        ${p.skills?.length ? `
        <div class="px-4 sm:px-5 py-3 border-t border-slate-100 dark:border-slate-700">
          <div class="text-xs text-slate-400 dark:text-slate-500 mb-1.5">보유 스킬</div>
          <div class="flex flex-wrap gap-1.5">
            ${p.skills.map(s => `<span class="text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full">${s}</span>`).join('')}
          </div>
        </div>` : ''}

        <!-- 자기소개서 -->
        ${m.has_cover_letter ? `
        <div class="px-4 sm:px-5 py-3 border-t border-slate-100 dark:border-slate-700">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900 px-2 py-0.5 rounded-full">자기소개서 종합 ${m.cover_letter_score}점</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
            ${scoreBar('직무 연관성', m.cover_letter_relevance)}
            ${scoreBar('성장 가능성', m.cover_letter_growth)}
            ${scoreBar('논리성/구체성', m.cover_letter_logic)}
          </div>
        </div>` : `
        <div class="px-4 sm:px-5 py-2 border-t border-slate-100 dark:border-slate-700">
          <span class="text-xs text-slate-400 dark:text-slate-500">자기소개서 미포함</span>
        </div>`}

        <!-- 강점/약점 -->
        <div class="px-4 sm:px-5 py-3 grid grid-cols-2 gap-4 border-t border-slate-100 dark:border-slate-700">
          <div>
            <div class="text-xs text-slate-400 dark:text-slate-500 mb-1">강점</div>
            <ul class="space-y-0.5">${(m.strengths || []).map(s => `<li class="text-sm text-green-700 dark:text-green-400">✓ ${s}</li>`).join('')}</ul>
          </div>
          <div>
            <div class="text-xs text-slate-400 dark:text-slate-500 mb-1">약점</div>
            <ul class="space-y-0.5">${(m.weaknesses || []).map(s => `<li class="text-sm text-red-600 dark:text-red-400">✗ ${s}</li>`).join('')}</ul>
          </div>
        </div>

        <!-- AI 평가 의견 -->
        <div class="px-4 sm:px-5 py-3 border-t border-slate-100 dark:border-slate-700">
          <div class="text-xs text-slate-400 dark:text-slate-500 mb-1">AI 평가 의견</div>
          <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${m.reasoning}</p>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id, header) {
  const detail = document.getElementById(id);
  const chevron = header.querySelector('.card-chevron');
  const isHidden = detail.classList.contains('hidden');
  detail.classList.toggle('hidden', !isHidden);
  chevron.style.transform = isHidden ? 'rotate(180deg)' : '';
}

function printResult() {
  document.querySelectorAll('[id^="card-detail-"]').forEach(el => el.classList.remove('hidden'));
  document.querySelectorAll('.card-chevron').forEach(el => { el.style.transform = 'rotate(180deg)'; });
  const details = document.querySelector('#filtered-section details');
  if (details) details.open = true;
  window.print();
}
</script>
</body>
</html>
