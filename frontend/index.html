<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JD 후보자 매칭 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.2s; }
    .drop-zone.drag-over { border-color: #6366f1; background: #eef2ff; }
    .file-chip { display:inline-flex; align-items:center; gap:4px; background:#e0e7ff; color:#3730a3; border-radius:9999px; padding:2px 10px; font-size:13px; }
    .progress-bar { transition: width 0.4s ease; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<div class="max-w-3xl mx-auto py-10 px-4">
  <!-- 헤더 -->
  <div class="mb-8 text-center relative">
    <h1 class="text-3xl font-bold text-indigo-700">JD 후보자 매칭 시스템</h1>
    <p class="text-slate-500 mt-1">채용공고와 이력서를 업로드하면 AI가 최적 후보자를 찾아드립니다</p>
    <a href="/history" class="absolute right-0 top-0 text-sm text-indigo-600 hover:underline">분석 이력 보기 →</a>
  </div>

  <!-- JD 입력 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <h2 class="text-lg font-semibold text-slate-800 mb-3">① 채용공고(JD) 입력</h2>

    <!-- 탭 -->
    <div class="flex border-b border-slate-200 mb-4">
      <button id="tab-pdf" onclick="switchJdTab('pdf')"
        class="px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600">
        PDF 업로드
      </button>
      <button id="tab-text" onclick="switchJdTab('text')"
        class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600">
        텍스트 직접 입력
      </button>
    </div>

    <!-- PDF 탭 -->
    <div id="jd-tab-pdf">
      <div id="jd-drop" class="drop-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('jd-input').click()">
        <svg class="mx-auto mb-2 w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p class="text-slate-500 text-sm">PDF / DOCX / PPTX 파일을 드래그하거나 클릭하여 업로드</p>
        <div id="jd-name" class="mt-2 hidden"><span class="file-chip" id="jd-chip"></span></div>
      </div>
      <input type="file" id="jd-input" accept=".pdf,.docx,.pptx,.ppt" class="hidden" />
    </div>

    <!-- 텍스트 입력 탭 -->
    <div id="jd-tab-text" class="hidden space-y-3">
      <div>
        <label class="text-sm font-medium text-slate-700">직무</label>
        <input id="jd-t-position" type="text" placeholder="예: 경영지원팀 경영지원 담당자"
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">주요 업무</label>
        <textarea id="jd-t-responsibilities" rows="3" placeholder="예: 예산 관리, 계약서 검토, 사내 행사 기획 등"
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">지원 자격</label>
        <textarea id="jd-t-requirements" rows="3" placeholder="예: 경력 3년 이상, 대졸 이상, Excel 중급 이상"
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">우대사항</label>
        <textarea id="jd-t-preferred" rows="2" placeholder="예: 협회/단체 근무 경험, 영어 가능자"
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
      </div>
    </div>
  </div>

  <!-- 이력서 업로드 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <h2 class="text-lg font-semibold text-slate-800 mb-3">② 이력서 업로드 <span class="text-sm font-normal text-slate-400">(최대 30개)</span></h2>
    <div id="resume-drop" class="drop-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('resume-input').click()">
      <svg class="mx-auto mb-2 w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
        <p class="text-slate-500 text-sm">PDF / DOCX / PPTX 파일을 드래그하거나 클릭하여 업로드</p>
      <p class="text-xs text-slate-400 mt-1">※ PPTX는 이미지로 삽입된 텍스트는 분석되지 않을 수 있습니다</p>
    </div>
    <input type="file" id="resume-input" accept=".pdf,.docx,.pptx,.ppt" multiple class="hidden" />
    <div id="resume-list" class="flex flex-wrap gap-2 mt-3"></div>
  </div>

  <!-- 필터 조건 설정 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <button id="filter-toggle" class="w-full flex items-center justify-between text-lg font-semibold text-slate-800" onclick="toggleFilter()">
      <span>③ 필터 조건 설정 <span class="text-sm font-normal text-slate-400">(선택사항)</span></span>
      <svg id="filter-arrow" class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div id="filter-body" class="mt-4 hidden grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-slate-600 font-medium">직무명 <span class="text-slate-400">(AI 추출값 덮어쓰기)</span></label>
        <input id="f-position" type="text" placeholder="예: 경영지원, 홍보기획" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">도메인/업종 <span class="text-slate-400">(AI 추출값 덮어쓰기)</span></label>
        <input id="f-domain" type="text" placeholder="예: 협회, IT, 금융" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 경력 (년)</label>
        <input id="f-exp" type="number" min="0" step="0.5" placeholder="예: 3" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 연봉 (만원)</label>
        <input id="f-salary" type="number" min="0" step="100" placeholder="예: 3000" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">나이 범위</label>
        <div class="flex gap-2 mt-1">
          <input id="f-min-age" type="number" min="18" placeholder="최소" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          <span class="flex items-center text-slate-400">~</span>
          <input id="f-max-age" type="number" placeholder="최대" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 학력</label>
        <select id="f-edu" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
          <option value="">선택 안 함</option>
          <option value="고졸">고등학교 졸업 이상</option>
          <option value="전문대졸">전문학사 졸업 이상</option>
          <option value="대졸">학사 졸업 이상</option>
          <option value="대학원졸">석사 졸업 이상</option>
          <option value="박사">박사 졸업 이상</option>
        </select>
      </div>
      <div class="col-span-2">
        <label class="text-sm text-slate-600 font-medium">필수 자격 조건 <span class="text-slate-400">(쉼표로 구분 — 자격증, 스킬, 교육 이수 등)</span></label>
        <input id="f-certs" type="text" placeholder="예: 정보처리기사, Python, 사회복지사, AWS" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>

      <!-- 영어 성적 -->
      <div class="col-span-2 pt-2 border-t border-slate-100">
        <div class="text-sm font-medium text-slate-700 mb-3">영어 성적 <span class="text-slate-400 font-normal">(선택사항, 정보 없으면 통과)</span></div>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs text-slate-600 font-medium">토익 최소 점수</label>
            <input id="f-toeic" type="number" min="0" max="990" step="5" placeholder="예: 800"
              class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          </div>
          <div>
            <label class="text-xs text-slate-600 font-medium">오픽 최소 등급</label>
            <select id="f-opic" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
              <option value="">선택 안 함</option>
              <option value="AL">AL</option>
              <option value="IH">IH</option>
              <option value="IM3">IM3</option>
              <option value="IM2">IM2</option>
              <option value="IM1">IM1</option>
              <option value="IL">IL</option>
              <option value="NH">NH</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-600 font-medium">토익스피킹 최소 등급</label>
            <select id="f-toeic-speaking" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
              <option value="">선택 안 함</option>
              <option value="AL">AL</option>
              <option value="IH">IH</option>
              <option value="IL">IL</option>
              <option value="NH">NH</option>
              <option value="NM">NM</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 점수 가중치 설정 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <button id="weight-toggle" class="w-full flex items-center justify-between text-lg font-semibold text-slate-800" onclick="toggleWeight()">
      <span>④ 점수 가중치 설정 <span class="text-sm font-normal text-slate-400">(선택사항, 합계 100%)</span></span>
      <svg id="weight-arrow" class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div id="weight-body" class="mt-4 hidden">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-slate-600 font-medium">스킬 매칭 (%)</label>
          <input id="w-skill" type="number" min="0" max="100" value="35" oninput="updateWeightTotal()"
            class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="text-sm text-slate-600 font-medium">경력 적합 (%)</label>
          <input id="w-experience" type="number" min="0" max="100" value="30" oninput="updateWeightTotal()"
            class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="text-sm text-slate-600 font-medium">학력 충족 (%)</label>
          <input id="w-education" type="number" min="0" max="100" value="15" oninput="updateWeightTotal()"
            class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="text-sm text-slate-600 font-medium">도메인 적합 (%)</label>
          <input id="w-other" type="number" min="0" max="100" value="10" oninput="updateWeightTotal()"
            class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div class="col-span-2">
          <label class="text-sm text-slate-600 font-medium">자기소개서 <span class="text-slate-400">(자기소개서 미포함 이력서는 0점 처리)</span></label>
          <input id="w-cover-letter" type="number" min="0" max="100" value="10" oninput="updateWeightTotal()"
            class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>
      <div id="weight-total-box" class="mt-3 text-sm text-center font-medium">
        합계: <span id="weight-total" class="text-indigo-600">100</span>% — <span id="weight-status" class="text-green-600">정상</span>
      </div>
    </div>
  </div>

  <!-- 분석 버튼 -->
  <button id="analyze-btn" onclick="startAnalysis()"
    class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-base transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
    분석 시작
  </button>

  <!-- 진행 상황 -->
  <div id="progress-section" class="hidden mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <h3 class="font-semibold text-slate-700 mb-3">진행 상황</h3>
    <div class="w-full bg-slate-100 rounded-full h-3 mb-3">
      <div id="progress-bar" class="progress-bar bg-indigo-500 h-3 rounded-full" style="width:0%"></div>
    </div>
    <p id="progress-msg" class="text-sm text-slate-500"></p>
    <div id="progress-log" class="mt-3 max-h-40 overflow-y-auto text-xs text-slate-400 space-y-1"></div>
    <a id="go-history-btn" href="/history"
       class="hidden mt-4 w-full block text-center py-2 rounded-xl bg-yellow-400 hover:bg-yellow-500 text-white font-semibold text-sm">
      분석 이력에서 결과 확인하기 →
    </a>
  </div>
</div>

<script>
  let jdFile = null;
  let resumeFiles = [];
  let jdMode = 'pdf'; // 'pdf' or 'text'

  function switchJdTab(mode) {
    jdMode = mode;
    document.getElementById('jd-tab-pdf').classList.toggle('hidden', mode !== 'pdf');
    document.getElementById('jd-tab-text').classList.toggle('hidden', mode !== 'text');
    document.getElementById('tab-pdf').className = mode === 'pdf'
      ? 'px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600'
      : 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600';
    document.getElementById('tab-text').className = mode === 'text'
      ? 'px-4 py-2 text-sm font-medium border-b-2 border-indigo-600 text-indigo-600'
      : 'px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600';
  }

  // JD 파일 선택
  document.getElementById('jd-input').addEventListener('change', e => {
    jdFile = e.target.files[0];
    if (jdFile) {
      document.getElementById('jd-chip').textContent = '📄 ' + jdFile.name;
      document.getElementById('jd-name').classList.remove('hidden');
    }
  });

  // 이력서 파일 선택
  document.getElementById('resume-input').addEventListener('change', e => {
    addResumeFiles(Array.from(e.target.files));
  });

  function addResumeFiles(files) {
    files.forEach(f => {
      if (!resumeFiles.find(r => r.name === f.name)) resumeFiles.push(f);
    });
    renderResumeList();
  }

  function removeResume(name) {
    resumeFiles = resumeFiles.filter(f => f.name !== name);
    renderResumeList();
  }

  function renderResumeList() {
    const list = document.getElementById('resume-list');
    list.innerHTML = '';
    resumeFiles.forEach(f => {
      list.innerHTML += `<span class="file-chip">📄 ${f.name} <button onclick="removeResume('${f.name}')" class="ml-1 text-indigo-400 hover:text-red-500 font-bold">×</button></span>`;
    });
  }

  // 드래그 앤 드롭
  ['jd-drop', 'resume-drop'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('drag-over');
      const allowed = ['.pdf', '.docx', '.pptx', '.ppt'];
      const files = Array.from(e.dataTransfer.files).filter(f => allowed.some(ext => f.name.toLowerCase().endsWith(ext)));
      if (id === 'jd-drop' && files[0]) {
        jdFile = files[0];
        document.getElementById('jd-chip').textContent = '📄 ' + jdFile.name;
        document.getElementById('jd-name').classList.remove('hidden');
      } else if (id === 'resume-drop') {
        addResumeFiles(files);
      }
    });
  });

  // 필터 토글
  function toggleFilter() {
    const body = document.getElementById('filter-body');
    const arrow = document.getElementById('filter-arrow');
    body.classList.toggle('hidden');
    body.classList.toggle('grid');
    arrow.classList.toggle('rotate-180');
  }

  // 가중치 토글
  function toggleWeight() {
    const body = document.getElementById('weight-body');
    const arrow = document.getElementById('weight-arrow');
    body.classList.toggle('hidden');
    arrow.classList.toggle('rotate-180');
  }

  // 가중치 합계 실시간 표시
  function updateWeightTotal() {
    const total = ['w-skill','w-experience','w-education','w-other','w-cover-letter']
      .reduce((sum, id) => sum + (parseInt(document.getElementById(id).value) || 0), 0);
    document.getElementById('weight-total').textContent = total;
    const ok = total === 100;
    document.getElementById('weight-status').textContent = ok ? '정상' : '합계가 100이 되어야 합니다';
    document.getElementById('weight-status').className = ok ? 'text-green-600' : 'text-red-500';
    document.getElementById('analyze-btn').disabled = !ok;
  }

  // 분석 시작
  async function startAnalysis() {
    if (jdMode === 'pdf' && !jdFile) return alert('JD PDF 파일을 업로드하세요.');
    if (jdMode === 'text' && !document.getElementById('jd-t-position').value.trim()
        && !document.getElementById('jd-t-responsibilities').value.trim()
        && !document.getElementById('jd-t-requirements').value.trim()) {
      return alert('직무, 주요 업무, 지원 자격 중 하나 이상을 입력하세요.');
    }
    if (resumeFiles.length === 0) return alert('이력서 PDF 파일을 최소 1개 이상 업로드하세요.');

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    btn.textContent = '분석 중...';

    document.getElementById('progress-section').classList.remove('hidden');
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('progress-msg').textContent = 'JD 분석 시작...';
    document.getElementById('progress-log').innerHTML = '';

    const formData = new FormData();
    if (jdMode === 'pdf') {
      formData.append('jd_file', jdFile);
    } else {
      formData.append('jd_text_position', document.getElementById('jd-t-position').value);
      formData.append('jd_text_responsibilities', document.getElementById('jd-t-responsibilities').value);
      formData.append('jd_text_requirements', document.getElementById('jd-t-requirements').value);
      formData.append('jd_text_preferred', document.getElementById('jd-t-preferred').value);
    }
    resumeFiles.forEach(f => formData.append('resume_files', f));
    formData.append('position_override', document.getElementById('f-position').value);
    formData.append('domain_override', document.getElementById('f-domain').value);
    formData.append('min_experience_years', document.getElementById('f-exp').value);
    formData.append('min_age', document.getElementById('f-min-age').value);
    formData.append('max_age', document.getElementById('f-max-age').value);
    formData.append('min_education', document.getElementById('f-edu').value);
    formData.append('required_qualifications', document.getElementById('f-certs').value);
    formData.append('min_toeic', document.getElementById('f-toeic').value);
    formData.append('min_opic', document.getElementById('f-opic').value);
    formData.append('min_toeic_speaking', document.getElementById('f-toeic-speaking').value);
    formData.append('min_last_salary', document.getElementById('f-salary').value);
    formData.append('weight_skill', document.getElementById('w-skill').value);
    formData.append('weight_experience', document.getElementById('w-experience').value);
    formData.append('weight_education', document.getElementById('w-education').value);
    formData.append('weight_other', document.getElementById('w-other').value);
    formData.append('weight_cover_letter', document.getElementById('w-cover-letter').value);

    // 진행 애니메이션
    let pct = 0;
    const progressTimer = setInterval(() => {
      pct = Math.min(pct + 1, 90);
      document.getElementById('progress-bar').style.width = pct + '%';
    }, 2000);

    document.getElementById('progress-msg').textContent = 'AI가 분석 중입니다. 이력서 수에 따라 수 분 소요될 수 있습니다...';

    try {
      const response = await fetch('/api/analyze', { method: 'POST', body: formData });
      clearInterval(progressTimer);

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error || '서버 오류');
      }

      const result = await response.json();
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('progress-msg').textContent = '분석 완료! 결과 페이지로 이동합니다...';
      addLog('🏁 분석 완료!', 'success');
      sessionStorage.setItem('analysisResult', JSON.stringify(result));
      setTimeout(() => { window.location.href = '/results'; }, 1000);

    } catch (e) {
      clearInterval(progressTimer);
      const isTimeout = e.message.includes('timeout') || e.message.includes('byte') || e.message.includes('JSON') || e.message.includes('fetch');
      if (isTimeout) {
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-bar').classList.replace('bg-indigo-500', 'bg-yellow-400');
        document.getElementById('progress-msg').textContent = '분석이 백그라운드에서 계속 진행 중입니다. 잠시 후 아래 버튼을 눌러 결과를 확인하세요.';
        addLog('⏳ 서버 응답 대기 시간이 초과됐지만 분석은 계속 실행 중입니다.', 'warn');
        addLog('✅ 완료되면 분석 이력에 자동 저장됩니다.', 'warn');
        document.getElementById('go-history-btn').classList.remove('hidden');
      } else {
        addLog('🚨 오류: ' + e.message, 'error');
      }
      btn.disabled = false;
      btn.textContent = '분석 시작';
    }
  }

  function addLog(text, type = 'info') {
    const log = document.getElementById('progress-log');
    const colorMap = { info: 'text-slate-400', success: 'text-green-600', warn: 'text-yellow-600', error: 'text-red-500' };
    log.innerHTML += `<div class="${colorMap[type]}">${text}</div>`;
    log.scrollTop = log.scrollHeight;
  }
</script>
</body>
</html>
