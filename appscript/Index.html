<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JD 후보자 매칭 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.2s; }
    .drop-zone.drag-over { border-color: #6366f1; background: #eef2ff; }
    .file-chip { display:inline-flex; align-items:center; gap:4px; background:#e0e7ff; color:#3730a3; border-radius:9999px; padding:2px 10px; font-size:13px; }
    .fit-상 { background:#d1fae5; color:#065f46; }
    .fit-중 { background:#fef3c7; color:#92400e; }
    .fit-하 { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
<div class="max-w-3xl mx-auto py-10 px-4" id="upload-section">

  <div class="mb-8 text-center">
    <h1 class="text-3xl font-bold text-indigo-700">JD 후보자 매칭 시스템</h1>
    <p class="text-slate-500 mt-1">채용공고와 이력서를 업로드하면 AI가 최적 후보자를 찾아드립니다</p>
  </div>

  <!-- JD 업로드 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <h2 class="text-lg font-semibold text-slate-800 mb-3">① 채용공고(JD) 업로드</h2>
    <div id="jd-drop" class="drop-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('jd-input').click()">
      <svg class="mx-auto mb-2 w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
      <p class="text-slate-500 text-sm">PDF 파일을 드래그하거나 클릭하여 업로드</p>
      <div id="jd-name" class="mt-2 hidden"><span class="file-chip" id="jd-chip"></span></div>
    </div>
    <input type="file" id="jd-input" accept=".pdf" class="hidden"/>
  </div>

  <!-- 이력서 업로드 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <h2 class="text-lg font-semibold text-slate-800 mb-3">② 이력서 업로드 <span class="text-sm font-normal text-slate-400">(여러 개 선택 가능)</span></h2>
    <div id="resume-drop" class="drop-zone rounded-xl p-6 text-center cursor-pointer" onclick="document.getElementById('resume-input').click()">
      <svg class="mx-auto mb-2 w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p class="text-slate-500 text-sm">PDF 파일 여러 개를 드래그하거나 클릭하여 업로드</p>
    </div>
    <input type="file" id="resume-input" accept=".pdf" multiple class="hidden"/>
    <div id="resume-list" class="flex flex-wrap gap-2 mt-3"></div>
  </div>

  <!-- 필터 조건 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
    <button class="w-full flex items-center justify-between text-lg font-semibold text-slate-800" onclick="toggleFilter()">
      <span>③ 필터 조건 설정 <span class="text-sm font-normal text-slate-400">(선택사항)</span></span>
      <svg id="filter-arrow" class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div id="filter-body" class="mt-4 hidden grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 경력 (년)</label>
        <input id="f-exp" type="number" min="0" step="0.5" placeholder="예: 3" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 연봉 (만원)</label>
        <input id="f-salary" type="number" min="0" step="100" placeholder="예: 3000" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">나이 범위</label>
        <div class="flex gap-2 mt-1">
          <input id="f-min-age" type="number" placeholder="최소" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          <span class="flex items-center text-slate-400">~</span>
          <input id="f-max-age" type="number" placeholder="최대" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        </div>
      </div>
      <div>
        <label class="text-sm text-slate-600 font-medium">최소 학력</label>
        <select id="f-edu" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
          <option value="">선택 안 함</option>
          <option value="고졸">고졸 이상</option>
          <option value="전문대졸">전문대졸 이상</option>
          <option value="대졸">대졸 이상</option>
          <option value="대학원졸">대학원졸 이상</option>
        </select>
      </div>
      <div class="col-span-2">
        <label class="text-sm text-slate-600 font-medium">필수 자격증 <span class="text-slate-400">(쉼표로 구분)</span></label>
        <input id="f-certs" type="text" placeholder="예: 정보처리기사, SQLD" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
      </div>
    </div>
  </div>

  <button id="analyze-btn" onclick="startAnalysis()"
    class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-base transition-colors shadow-md">
    분석 시작
  </button>

  <!-- 진행 상황 -->
  <div id="progress-section" class="hidden mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <h3 class="font-semibold text-slate-700 mb-3">진행 상황</h3>
    <div class="w-full bg-slate-100 rounded-full h-3 mb-3">
      <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width:0%"></div>
    </div>
    <p id="progress-msg" class="text-sm text-slate-500"></p>
    <div id="progress-log" class="mt-3 max-h-48 overflow-y-auto text-xs space-y-1"></div>
  </div>
</div>

<!-- 결과 섹션 -->
<div id="result-section" class="hidden max-w-5xl mx-auto py-10 px-4">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-indigo-700">분석 결과</h1>
      <p id="result-jd-title" class="text-slate-500 text-sm mt-0.5"></p>
    </div>
    <button onclick="resetPage()" class="text-sm text-indigo-600 hover:underline">← 새로 분석하기</button>
  </div>

  <div class="grid grid-cols-4 gap-3 mb-6" id="summary-cards"></div>
  <div id="filtered-section" class="hidden mb-6"></div>
  <div id="results-list" class="space-y-4"></div>
</div>

<script>
  const EDUCATION_LEVELS = {'고졸':1,'전문대졸':2,'대졸':3,'대학원졸':4,'석사':4,'박사':5};

  let jdFile = null;
  let resumeFiles = [];

  document.getElementById('jd-input').addEventListener('change', e => {
    jdFile = e.target.files[0];
    if (jdFile) {
      document.getElementById('jd-chip').textContent = '📄 ' + jdFile.name;
      document.getElementById('jd-name').classList.remove('hidden');
    }
  });

  document.getElementById('resume-input').addEventListener('change', e => {
    addResumeFiles(Array.from(e.target.files));
  });

  function addResumeFiles(files) {
    files.forEach(f => { if (!resumeFiles.find(r => r.name === f.name)) resumeFiles.push(f); });
    renderResumeList();
  }

  function removeResume(name) {
    resumeFiles = resumeFiles.filter(f => f.name !== name);
    renderResumeList();
  }

  function renderResumeList() {
    const list = document.getElementById('resume-list');
    list.innerHTML = resumeFiles.map(f =>
      `<span class="file-chip">📄 ${f.name} <button onclick="removeResume('${f.name}')" class="ml-1 text-indigo-400 hover:text-red-500 font-bold">×</button></span>`
    ).join('');
  }

  ['jd-drop','resume-drop'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.pdf'));
      if (id === 'jd-drop' && files[0]) {
        jdFile = files[0];
        document.getElementById('jd-chip').textContent = '📄 ' + jdFile.name;
        document.getElementById('jd-name').classList.remove('hidden');
      } else if (id === 'resume-drop') addResumeFiles(files);
    });
  });

  function toggleFilter() {
    const body = document.getElementById('filter-body');
    body.classList.toggle('hidden');
    body.classList.toggle('grid');
    document.getElementById('filter-arrow').classList.toggle('rotate-180');
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function gsRun(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  function applyFilter(profile, criteria) {
    const reasons = [];
    const exp = profile.total_experience_years;
    if (criteria.min_experience_years && (exp == null || exp < criteria.min_experience_years))
      reasons.push(`경력 부족 (${exp}년 < ${criteria.min_experience_years}년)`);
    const age = profile.age;
    if (criteria.min_age && (age == null || age < criteria.min_age))
      reasons.push(`나이 미달 (${age}세 < ${criteria.min_age}세)`);
    if (criteria.max_age && (age == null || age > criteria.max_age))
      reasons.push(`나이 초과 (${age}세 > ${criteria.max_age}세)`);
    const edu = profile.education;
    const minEdu = criteria.min_education;
    if (minEdu && (edu == null || (EDUCATION_LEVELS[edu]||0) < (EDUCATION_LEVELS[minEdu]||0)))
      reasons.push(`학력 미달 (${edu} < ${minEdu})`);
    const salary = profile.last_salary;
    if (criteria.min_last_salary && (salary == null || salary < criteria.min_last_salary))
      reasons.push(`연봉 미달 (${salary}만원 < ${criteria.min_last_salary}만원)`);
    (criteria.required_certifications||[]).forEach(cert => {
      if (cert && !(profile.certifications||[]).includes(cert))
        reasons.push(`자격증 없음: ${cert}`);
    });
    return reasons;
  }

  function addLog(text, type='info') {
    const log = document.getElementById('progress-log');
    const colors = {info:'text-slate-400', success:'text-green-600', warn:'text-yellow-600', error:'text-red-500'};
    log.innerHTML += `<div class="${colors[type]}">${text}</div>`;
    log.scrollTop = log.scrollHeight;
  }

  function setProgress(pct, msg) {
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-msg').textContent = msg;
  }

  async function startAnalysis() {
    if (!jdFile) return alert('JD PDF 파일을 업로드하세요.');
    if (resumeFiles.length === 0) return alert('이력서 PDF 파일을 최소 1개 이상 업로드하세요.');

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    btn.textContent = '분석 중...';
    document.getElementById('progress-section').classList.remove('hidden');

    const criteria = {
      min_experience_years: parseFloat(document.getElementById('f-exp').value) || null,
      min_age: parseInt(document.getElementById('f-min-age').value) || null,
      max_age: parseInt(document.getElementById('f-max-age').value) || null,
      min_education: document.getElementById('f-edu').value || null,
      min_last_salary: parseInt(document.getElementById('f-salary').value) || null,
      required_certifications: document.getElementById('f-certs').value.split(',').map(s=>s.trim()).filter(Boolean)
    };

    try {
      // JD 분석
      setProgress(5, 'JD 분석 중...');
      addLog('📋 채용공고 분석 시작...');
      const jdBase64 = await fileToBase64(jdFile);
      const jdResult = await gsRun('analyzeJD', jdBase64);
      if (!jdResult.success) throw new Error('JD 분석 실패: ' + jdResult.error);
      const jd = jdResult.data;
      addLog(`✅ JD 분석 완료: ${jd.position} / ${jd.domain}`, 'success');

      const total = resumeFiles.length;
      const matched = [];
      const filteredOut = [];

      for (let i = 0; i < total; i++) {
        const file = resumeFiles[i];
        const pct = 10 + Math.round((i / total) * 85);
        setProgress(pct, `이력서 분석 중: ${file.name} (${i+1}/${total})`);
        addLog(`[${i+1}/${total}] ${file.name} 분석 중...`);

        const base64 = await fileToBase64(file);
        const resumeResult = await gsRun('analyzeResume', base64, file.name);
        const profile = resumeResult.data;

        const filterReasons = applyFilter(profile, criteria);
        if (filterReasons.length > 0) {
          addLog(`  ❌ 필터 탈락: ${filterReasons.join(', ')}`, 'warn');
          filteredOut.push({ profile, reasons: filterReasons });
        } else {
          addLog(`  ✅ 필터 통과 → 매칭 평가 중...`);
          const matchResult = await gsRun('matchCandidate', jd, profile);
          if (matchResult.success) {
            const m = matchResult.data;
            m.profile = profile;
            matched.push(m);
            addLog(`  🎯 점수: ${m.total_score}점 (${m.recommendation})`, 'success');
          } else {
            addLog(`  ⚠️ 매칭 오류: ${matchResult.error}`, 'warn');
          }
        }
      }

      matched.sort((a, b) => (b.total_score||0) - (a.total_score||0));
      setProgress(100, '분석 완료!');
      addLog('🏁 모든 분석 완료!', 'success');

      setTimeout(() => showResults(jd, matched, filteredOut, total), 800);

    } catch(e) {
      addLog('🚨 오류: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '분석 시작';
    }
  }

  function showResults(jd, matched, filteredOut, total) {
    document.getElementById('upload-section').classList.add('hidden');
    const rs = document.getElementById('result-section');
    rs.classList.remove('hidden');

    document.getElementById('result-jd-title').textContent = `직무: ${jd.position||'-'} | 도메인: ${jd.domain||'-'}`;

    const topCount = matched.filter(r => (r.total_score||0) >= 70).length;
    document.getElementById('summary-cards').innerHTML = [
      {label:'총 이력서', value:total, color:'indigo'},
      {label:'필터 탈락', value:filteredOut.length, color:'red'},
      {label:'분석 완료', value:matched.length, color:'green'},
      {label:'상위 후보', value:topCount, color:'blue'},
    ].map(c => `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 text-center">
      <div class="text-3xl font-bold text-${c.color}-600">${c.value}</div>
      <div class="text-sm text-slate-500 mt-1">${c.label}</div>
    </div>`).join('');

    if (filteredOut.length > 0) {
      const fs = document.getElementById('filtered-section');
      fs.classList.remove('hidden');
      fs.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="font-semibold text-slate-700 mb-2">필터 탈락 후보자 (${filteredOut.length}명)</div>
        ${filteredOut.map(f => `<div class="flex items-start gap-2 py-1.5 border-t border-slate-100">
          <span class="text-red-400">✗</span>
          <div><span class="font-medium text-slate-700">${f.profile.name||f.profile.filename}</span>
          <div class="text-xs text-slate-400 mt-0.5">${f.reasons.join(' · ')}</div></div>
        </div>`).join('')}
      </div>`;
    }

    if (matched.length === 0) {
      document.getElementById('results-list').innerHTML = '<p class="text-slate-400 text-center py-10">필터 통과 후보자가 없습니다.</p>';
      return;
    }

    document.getElementById('results-list').innerHTML = matched.map((m, idx) => {
      const p = m.profile;
      const scoreColor = m.total_score >= 80 ? 'text-green-600' : m.total_score >= 60 ? 'text-yellow-600' : 'text-red-500';
      const fitColors = {'상':'bg-green-100 text-green-800','중':'bg-yellow-100 text-yellow-800','하':'bg-red-100 text-red-800'};
      const recColors = {'적극 추천':'bg-blue-100 text-blue-800','추천':'bg-green-100 text-green-800','검토 필요':'bg-yellow-100 text-yellow-800','미추천':'bg-red-100 text-red-800'};

      const bar = (score) => {
        const c = score>=80?'bg-green-500':score>=60?'bg-yellow-400':'bg-red-400';
        return `<div><div class="text-xs text-slate-400 mb-1">${score}점</div>
          <div class="bg-slate-100 rounded-full h-2"><div class="${c} h-2 rounded-full" style="width:${score}%"></div></div></div>`;
      };

      return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">${idx+1}</div>
            <div>
              <div class="font-semibold text-slate-800">${p.name||p.filename}</div>
              <div class="text-xs text-slate-400">${p.filename}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="${scoreColor} text-3xl font-bold">${m.total_score}<span class="text-base font-normal text-slate-400">점</span></div>
            <div class="flex gap-1 mt-1 justify-end">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${fitColors[m.overall_fit]||''}">${m.overall_fit}급</span>
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${recColors[m.recommendation]||''}">${m.recommendation}</span>
            </div>
          </div>
        </div>
        <div class="px-5 py-3 grid grid-cols-3 gap-3 border-b border-slate-100">
          <div><div class="text-xs text-slate-400 mb-1">스킬 매칭</div>${bar(m.skill_match_score)}</div>
          <div><div class="text-xs text-slate-400 mb-1">경력 적합</div>${bar(m.experience_score)}</div>
          <div><div class="text-xs text-slate-400 mb-1">학력 충족</div>${bar(m.education_score)}</div>
        </div>
        <div class="px-5 py-3 flex flex-wrap gap-x-5 gap-y-1 text-sm text-slate-500 border-b border-slate-100">
          ${p.age ? `<span>나이: <b>${p.age}세</b></span>` : ''}
          ${p.total_experience_years != null ? `<span>경력: <b>${p.total_experience_years}년</b></span>` : ''}
          ${p.education ? `<span>학력: <b>${p.education}</b>${p.education_major?' ('+p.education_major+')':''}</span>` : ''}
          ${p.last_salary ? `<span>연봉: <b>${p.last_salary.toLocaleString()}만원</b></span>` : ''}
        </div>
        ${(p.skills||[]).length ? `<div class="px-5 py-3 border-b border-slate-100">
          <div class="text-xs text-slate-400 mb-1.5">보유 스킬</div>
          <div class="flex flex-wrap gap-1.5">${(p.skills||[]).map(s=>`<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${s}</span>`).join('')}</div>
        </div>` : ''}
        <div class="px-5 py-3 grid grid-cols-2 gap-4 border-b border-slate-100">
          <div><div class="text-xs text-slate-400 mb-1">강점</div>
            <ul class="space-y-0.5">${(m.strengths||[]).map(s=>`<li class="text-sm text-green-700">✓ ${s}</li>`).join('')}</ul></div>
          <div><div class="text-xs text-slate-400 mb-1">약점</div>
            <ul class="space-y-0.5">${(m.weaknesses||[]).map(s=>`<li class="text-sm text-red-600">✗ ${s}</li>`).join('')}</ul></div>
        </div>
        <div class="px-5 py-3">
          <div class="text-xs text-slate-400 mb-1">AI 평가 의견</div>
          <p class="text-sm text-slate-600 leading-relaxed">${m.reasoning}</p>
        </div>
      </div>`;
    }).join('');
  }

  function resetPage() {
    document.getElementById('upload-section').classList.remove('hidden');
    document.getElementById('result-section').classList.add('hidden');
    document.getElementById('progress-section').classList.add('hidden');
    document.getElementById('progress-log').innerHTML = '';
    document.getElementById('analyze-btn').disabled = false;
    document.getElementById('analyze-btn').textContent = '분석 시작';
    jdFile = null;
    resumeFiles = [];
    renderResumeList();
    document.getElementById('jd-name').classList.add('hidden');
  }
</script>
