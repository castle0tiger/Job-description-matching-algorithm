<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분석 이력 - JD 후보자 매칭 시스템</title>
  <script>
    (function() {
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen font-sans transition-colors duration-200">

<div class="max-w-4xl mx-auto py-8 px-4">

  <!-- 헤더 -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-indigo-700 dark:text-indigo-400">분석 이력</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">이전 분석 결과를 다시 볼 수 있습니다</p>
    </div>
    <div class="flex items-center gap-3">
      <a href="/" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">← 새로 분석하기</a>
      <button onclick="toggleDark()" title="다크/라이트 모드"
        class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
        <svg class="w-5 h-5 text-slate-500 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg class="w-5 h-5 text-yellow-400 hidden dark:block" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 001.061-1.06l-1.59-1.591zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.166 6.166a.75.75 0 001.06 1.06l1.59 1.591a.75.75 0 001.061-1.06L6.166 6.166z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 검색/필터 -->
  <div id="search-bar" class="hidden mb-4 flex flex-col sm:flex-row gap-2">
    <input id="search-input" type="text" placeholder="직무명 또는 도메인으로 검색..."
      oninput="filterList()"
      class="flex-1 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-2 text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-300" />
    <select id="search-date" onchange="filterList()"
      class="border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-300">
      <option value="">전체 기간</option>
      <option value="today">오늘</option>
      <option value="week">최근 7일</option>
      <option value="month">최근 30일</option>
    </select>
    <div id="search-count" class="flex items-center text-xs text-slate-400 dark:text-slate-500 px-1 shrink-0"></div>
  </div>

  <!-- 이력 목록 -->
  <div id="history-list" class="space-y-3"></div>
  <div id="no-results" class="hidden text-center py-12">
    <p class="text-slate-400 dark:text-slate-500">검색 결과가 없습니다.</p>
  </div>
  <div id="empty" class="hidden text-center py-20">
    <p class="text-slate-400 dark:text-slate-500 text-lg">저장된 분석 이력이 없습니다.</p>
    <a href="/" class="mt-4 inline-block text-indigo-600 dark:text-indigo-400 hover:underline">← 분석 시작하기</a>
  </div>
  <div id="loading" class="text-center py-20 text-slate-400 dark:text-slate-500">불러오는 중...</div>
</div>

<script>
let allItems = [];

function toggleDark() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function renderItem(item) {
  return `
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 sm:p-5"
         data-position="${(item.jd_position || '').toLowerCase()}"
         data-domain="${(item.jd_domain || '').toLowerCase()}"
         data-date="${item.created_at}">
      <div class="flex items-start justify-between gap-3 flex-wrap sm:flex-nowrap">
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-slate-800 dark:text-slate-100 truncate">
            ${item.jd_position || '직무 미상'}
            ${item.jd_domain ? `<span class="text-slate-400 dark:text-slate-500 font-normal text-sm">· ${item.jd_domain}</span>` : ''}
          </div>
          <div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">${item.created_at}</div>
          <div class="flex gap-3 mt-2 text-sm text-slate-500 dark:text-slate-400 flex-wrap">
            <span>총 <b class="text-slate-700 dark:text-slate-200">${item.total_resumes}</b>명</span>
            <span>탈락 <b class="text-red-500">${item.filtered_out_count}</b>명</span>
            <span>분석 <b class="text-green-600 dark:text-green-400">${item.analyzed_count}</b>명</span>
            ${item.top_candidate_name ? `<span class="text-indigo-600 dark:text-indigo-400">· 1위: <b>${item.top_candidate_name}</b> ${item.top_candidate_score != null ? `<span class="text-slate-400 dark:text-slate-500">(${item.top_candidate_score}점)</span>` : ''}</span>` : ''}
          </div>
        </div>
        <div class="flex gap-2 shrink-0">
          <a href="/results?id=${item.id}"
             class="text-sm bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white px-4 py-1.5 rounded-lg transition-colors">
            결과 보기
          </a>
          <button onclick="del(${item.id}, this)"
                  class="text-sm bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900 hover:text-red-600 dark:hover:text-red-400 transition-colors">
            삭제
          </button>
        </div>
      </div>
    </div>`;
}

function filterList() {
  const keyword = document.getElementById('search-input').value.toLowerCase().trim();
  const period = document.getElementById('search-date').value;

  const now = new Date();
  const cutoff = period === 'today'
    ? new Date(now.getFullYear(), now.getMonth(), now.getDate())
    : period === 'week'
    ? new Date(now - 7 * 86400000)
    : period === 'month'
    ? new Date(now - 30 * 86400000)
    : null;

  const filtered = allItems.filter(item => {
    if (keyword) {
      const pos = (item.jd_position || '').toLowerCase();
      const dom = (item.jd_domain || '').toLowerCase();
      if (!pos.includes(keyword) && !dom.includes(keyword)) return false;
    }
    if (cutoff) {
      const d = new Date(item.created_at);
      if (d < cutoff) return false;
    }
    return true;
  });

  document.getElementById('history-list').innerHTML = filtered.map(renderItem).join('');
  document.getElementById('search-count').textContent = `${filtered.length} / ${allItems.length}건`;
  document.getElementById('no-results').classList.toggle('hidden', filtered.length > 0);
}

async function load() {
  const res = await fetch('/api/history');
  const list = await res.json();
  document.getElementById('loading').classList.add('hidden');

  if (!list.length) {
    document.getElementById('empty').classList.remove('hidden');
    return;
  }

  allItems = list;
  document.getElementById('search-bar').classList.remove('hidden');
  document.getElementById('search-count').textContent = `${list.length} / ${list.length}건`;
  document.getElementById('history-list').innerHTML = list.map(renderItem).join('');
}

async function del(id, btn) {
  if (!confirm('이 분석 이력을 삭제할까요?')) return;
  const res = await fetch(`/api/history/${id}`, { method: 'DELETE' });
  if (res.ok) {
    allItems = allItems.filter(item => item.id !== id);
    btn.closest('[data-date]').remove();
    document.getElementById('search-count').textContent =
      `${document.querySelectorAll('#history-list [data-date]').length} / ${allItems.length}건`;
    if (!allItems.length) {
      document.getElementById('search-bar').classList.add('hidden');
      document.getElementById('empty').classList.remove('hidden');
    }
  }
}

load();
</script>
</body>
</html>
